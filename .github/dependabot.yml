version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The exporter is bumped by hand, together with its release.
      - dependency-name: markdown-pdf-export
      # Must match engines.vscode: a newer one lets code use APIs older VS Code lacks.
      - dependency-name: "@types/vscode"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
