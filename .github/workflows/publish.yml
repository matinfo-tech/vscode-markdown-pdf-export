name: Publish

# Release flow:
#   1. a release PR sets "version" in package.json and adds a "## [<version>]" section to
#      CHANGELOG.md (in place of "## [Unreleased]")
#   2. once merged: git tag -a v<version> -m v<version> && git push origin v<version>
#   3. approve the "release" deployment on the workflow run page
#
# The build job runs the checks and makes the .vsix without any publishing right. The publish
# job, gated by the "release" environment (owner approval, v* tags only), uploads that same file
# to both stores and attaches it to a GitHub release.
#
# Authentication: OIDC trusted publishing. Both store policies name:
#   owner matinfo-tech, repository vscode-markdown-pdf-export, workflow publish.yml,
#   environment release.
#   - Visual Studio Marketplace: publisher matinfo-tech → Trusted Publishing.
#   - Open VSX: Settings → Trusted Publishers, namespace matinfo-tech. Open VSX accepts this only
#     for an extension that already exists, so the FIRST release uses an access token: the
#     environment secret OVSX_PAT. Delete that secret once trusted publishing is registered.

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {} # each job asks for what it needs

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false # never use caching in release builds

      - name: Check tag, version, changelog and exporter pin
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(jq -r .version package.json)"
          echo "tag=$VERSION package.json=$PKG"
          test "$VERSION" = "$PKG"
          test "$(jq -r '.private // false' package.json)" = "false" || { echo "::error::package.json still says private: true"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"; exit 1; }
          pin="$(jq -r '.dependencies["markdown-pdf-export"]' package.json)"
          echo "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - run: npm ci
      - run: npm run ci

      - name: Package, unpack and use what is inside
        run: npm run smoke:vsix -- --keep "markdown-pdf-export-${GITHUB_REF_NAME#v}.vsix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to the stores
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=matinfo-tech.markdown-pdf-export
    permissions:
      contents: write # GitHub release
      id-token: write # trusted publishing to both stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      # The publishing tools come from package-lock.json, and no install script runs: only vsce
      # and ovsx execute with these rights, on the file the build job made.
      - run: npm ci --ignore-scripts

      - name: Publish to the Visual Studio Marketplace
        run: npx --no-install vsce publish --oidc --skip-duplicate --packagePath ./*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }} # first release only, see the top of this file
        run: |
          set -euo pipefail
          if [ -n "$OVSX_PAT" ]; then
            npx --no-install ovsx publish --skip-duplicate --packagePath ./*.vsix
          else
            npx --no-install ovsx publish --trusted-publishing --skip-duplicate --packagePath ./*.vsix
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\nVisual Studio Marketplace: https://marketplace.visualstudio.com/items?itemName=matinfo-tech.markdown-pdf-export\nOpen VSX: https://open-vsx.org/extension/matinfo-tech/markdown-pdf-export\n' >> notes.md
          cat notes.md

      - name: Create the GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            exit 0
          fi
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --verify-tag \
            --title "Markdown PDF Export for VS Code ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            "${flags[@]}"
