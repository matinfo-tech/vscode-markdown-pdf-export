name: CI

# Gate for main: runs on every PR targeting main and again after each merge.
# Branch protection should require the single "CI ok" check (see ci-ok below).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    # Runs the export command inside a real VS Code, with VS Code's own binary as Node.
    # Runners ship Google Chrome, which the exporter uses to draw the PDF.
    name: In VS Code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run
        if: runner.os != 'Linux'
        run: npm run test:integration

  package:
    name: Package (vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check the exporter is pinned to an exact version
        run: |
          v=$(jq -r '.dependencies["markdown-pdf-export"]' package.json)
          echo "markdown-pdf-export=$v"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$v" = "$(jq -r '.packages["node_modules/markdown-pdf-export"].version' package-lock.json)"
      - name: Package, unpack and use what is inside
        run: npm run smoke:vsix

  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, unit, integration, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
